name: StudiesDream 6H Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video ka Link'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Run 6 Hour Live
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          ffmpeg -re -stream_loop 24 -i "${{ inputs.video_url }}" -c:v libx264 -preset veryfast -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv rtmp://a.rtmp.youtube.com/live2/${{ inputs.stream_key }}
