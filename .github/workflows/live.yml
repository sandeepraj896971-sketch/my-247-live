name: StudiesDream 6H Live

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video ka Link'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tools
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          pip install gdown

      - name: Download Video from Drive
        run: |
          FILE_ID=$(echo "${{ inputs.video_url }}" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -1)
          echo "File ID: $FILE_ID"
          gdown --id $FILE_ID -O video.mp4 || wget -O video.mp4 "${{ inputs.video_url }}"

      - name: Run 6 Hour Live
        run: |
          ffmpeg -re -stream_loop 24 -i video.mp4 -c:v libx264 -preset veryfast -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv rtmp://a.rtmp.youtube.com/live2/${{ inputs.stream_key }}
