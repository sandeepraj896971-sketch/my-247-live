name: Dashboard Controlled Multi-Live

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Live Duration in Hours'
        required: false
        default: '5'
      yt_video_1:
        description: 'YouTube 1 Video URL'
        required: false
      yt_key_1:
        description: 'YouTube 1 Stream Key'
        required: false
      yt_video_2:
        description: 'YouTube 2 Video URL'
        required: false
      yt_key_2:
        description: 'YouTube 2 Stream Key'
        required: false
      yt_video_3:
        description: 'YouTube 3 Video URL'
        required: false
      yt_key_3:
        description: 'YouTube 3 Stream Key'
        required: false
      fb_video:
        description: 'Facebook Video URL'
        required: false
      fb_key:
        description: 'Facebook Stream Key'
        required: false

jobs:
  multi-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "YT_Live_1"
            platform: "youtube"
            video: ${{ inputs.yt_video_1 }}
            key: ${{ inputs.yt_key_1 }}
          - id: "YT_Live_2"
            platform: "youtube"
            video: ${{ inputs.yt_video_2 }}
            key: ${{ inputs.yt_key_2 }}
          - id: "YT_Live_3"
            platform: "youtube"
            video: ${{ inputs.yt_video_3 }}
            key: ${{ inputs.yt_key_3 }}
          - id: "FB_Live_1"
            platform: "facebook"
            video: ${{ inputs.fb_video }}
            key: ${{ inputs.fb_key }}

    steps:
      - name: Check Stream Inputs
        id: check
        run: |
          if [ -z "${{ matrix.video }}" ] || [ -z "${{ matrix.key }}" ]; then
            echo "active=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.id }} - Video ya Stream Key khali hai."
          else
            echo "active=true" >> $GITHUB_OUTPUT
          fi

      - name: Install FFmpeg and yt-dlp
        if: steps.check.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install -U yt-dlp

      - name: Download Unlisted Video
        if: steps.check.outputs.active == 'true'
        run: |
          yt-dlp -f "bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            -o "video_${{ matrix.id }}.mp4" "${{ matrix.video }}"

      - name: Push Live Stream (Infinite Loop)
        if: steps.check.outputs.active == 'true'
        env:
          STREAM_KEY: ${{ matrix.key }}
          HOURS: ${{ inputs.duration_hours }}
        run: |
          DURATION_SEC=$(( HOURS * 3580 ))

          if [ "${{ matrix.platform }}" == "facebook" ]; then
            RTMP_URL="rtmps://live-api-s.facebook.com:443/rtmp/${STREAM_KEY}"
          else
            RTMP_URL="rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"
          fi

          ffmpeg -re -stream_loop -1 -i "video_${{ matrix.id }}.mp4" \
            -t $DURATION_SEC \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_URL"
